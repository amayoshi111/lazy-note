# Bun の設定ファイル (https://bun.com/docs/runtime/bunfig)

[install]
# 公開から 1 日 (86400 秒) 未満のバージョンを、新規解決の対象から外す。
# pnpm 11 が既定で有効にしていた minimumReleaseAge (1440 分) と同じ長さの待機期間。
# Bun はこれに加えて、待機期間の直後に続けて公開されたバージョンも避けることがある。
# Bun の既定は無効。bun.lock に記録済みのバージョンには影響しない。
minimumReleaseAge = 86400

# node_modules を isolated レイアウトにする。トップレベルには package.json に書いた依存だけが
# 置かれ、書いていない推移依存は import できなくなる (pnpm と同じ厳密さ)。
# Bun の既定は、ワークスペースを使わない単一パッケージでは hoisted (フラットな配置)。
linker = "isolated"

[run]
# package.json の scripts と node_modules/.bin の CLI (vite / vitest / panda / tsc /
# biome / playwright) を、Node.js ではなく Bun で実行する。これらの CLI は
# `#!/usr/bin/env node` で始まるため、この設定が無いと Node.js が入っている環境
# (GitHub Actions のランナーなど) では Node.js で動いてしまう。
# `bun run` のたびに `--bun` を付けるのと同じ意味。`bunx` と、`bun install` が
# 実行する prepare スクリプトには効かない (prepare は package.json 側で `--bun` を付けている)。
# また、効くのはリポジトリのルートで `bun run` を実行したときだけ。`bun run` と `bun test` は
# 実行したディレクトリにある bunfig.toml しか読み込まないため、src/ などのサブディレクトリから
# 実行すると、この [run] と下の [test] の設定は読み込まれない ([install] は読み込まれる)。
bun = true

[test]
# `bun test` は Bun 組み込みのテストランナーを起動するコマンドで、このプロジェクトの
# Vitest (`bun run test`) は実行されない。取り違えて実行しても大量の失敗が出るだけなので、
# 起動時に案内を出して終了させる。preload は `bun test` のときだけ読み込まれる。
# サブディレクトリから `bun test` を実行した場合は、上の [run] と同じ理由で読み込まれない。
preload = ["./scripts/bunTestGuard.ts"]
